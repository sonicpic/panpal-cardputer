; M5Stack Cardputer (ESP32-S3 / StampS3)
; PlatformIO project — CardBridge wireless microphone/keyboard firmware

[env:cardputer]
; pioarduino platform: Arduino core 3.3.9 on ESP-IDF 5.5.4. The official
; espressif32 platform ships Arduino core 2.x (IDF 4.4) whose legacy I2S path
; yields all-zero samples from the ADV's ES8311 mic; M5Unified's ADV mic code
; is only proven on IDF 5.x (the factory demo builds on IDF 5.4).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino

; Native USB-Serial/JTAG is what shows up as /dev/cu.usbmodem*
monitor_speed = 115200
; No explicit port: PlatformIO auto-detects the single connected device.
; (The name changes with the physical USB port: usbmodem101 / usbmodem1401 / ...)
; NO PSRAM on the Cardputer ADV (Stamp-S3A / ESP32-S3FN8).
; Verified empirically 2026-07-13: both qio_qspi and qio_opi read PSRAM ID
; 0x00000000 ("chip not found"), and the official spec table lists no PSRAM.
; Third-party articles claiming 8MB PSRAM are wrong. RAM budget = 512KB SRAM.

; Route Arduino Serial to the native USB CDC so prints appear on the monitor
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    ; JSON line protocol parsing/serialization. Fixed-size documents are used
    ; in firmware so this does not introduce unbounded heap growth.
    bblanchon/ArduinoJson @ 6.21.5
