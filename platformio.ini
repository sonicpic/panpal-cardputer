; M5Stack Cardputer (ESP32-S3 / StampS3)
; PlatformIO project — first milestone: Hello World + keyboard echo over USB serial

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; Native USB-Serial/JTAG is what shows up as /dev/cu.usbmodem*
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1401
monitor_port = /dev/cu.usbmodem1401
; Enable the Cardputer ADV's 8MB external PSRAM.
; qio_qspi = quad flash + quad(QSPI) PSRAM — typical for an external PSRAM chip.
; If PSRAM still reads 0 (or boot loops), switch to qio_opi and re-test.
board_build.arduino.memory_type = qio_qspi

; Route Arduino Serial to the native USB CDC so prints appear on the monitor
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    m5stack/M5Cardputer
