; M5Stack Cardputer (ESP32-S3 / StampS3)
; PlatformIO project — first milestone: Hello World + keyboard echo over USB serial

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; Native USB-Serial/JTAG is what shows up as /dev/cu.usbmodem*
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1401
monitor_port = /dev/cu.usbmodem1401
; NO PSRAM on the Cardputer ADV (Stamp-S3A / ESP32-S3FN8).
; Verified empirically 2026-07-13: both qio_qspi and qio_opi read PSRAM ID
; 0x00000000 ("chip not found"), and the official spec table lists no PSRAM.
; Third-party articles claiming 8MB PSRAM are wrong. RAM budget = 512KB SRAM.

; Route Arduino Serial to the native USB CDC so prints appear on the monitor
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Cardputer
