[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardbridge"
version = "0.1.0"
description = "Mac bridge for the M5Stack Cardputer ADV wireless microphone and keyboard"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "zeroconf>=0.131",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
cardbridge = "cardbridge.__main__:main"

[tool.setuptools]
py-modules = ["fake_device"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cardbridge*"]
