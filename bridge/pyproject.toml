[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardbridge"
dynamic = ["version"]
description = "Internal bridge agent for the PanPal Cardputer ADV companion"
requires-python = ">=3.10"
dependencies = [
  "sounddevice>=0.4.6",
  "zeroconf>=0.131",
  "bleak>=3.0,<4",
  "pycaw>=20251023",
  "infi.systray==0.1.12.1",
]

[project.scripts]
cardbridge = "cardbridge.__main__:main"

[tool.setuptools]
py-modules = ["fake_device"]

[tool.setuptools.dynamic]
version = {attr = "cardbridge.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["cardbridge*"]
