name: Bug report
description: Report a reproducible PanPal problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include pairing tokens, passwords, API keys, Codex content, or recordings.
  - type: input
    id: version
    attributes:
      label: PanPal and firmware versions
      placeholder: PanPal 1.4.6 build 29; firmware 0.6.5 build 26
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics and logs
      render: powershell
  - type: checkboxes
    id: redaction
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed tokens, passwords, API keys, Codex content, personal paths, and recordings.
          required: true
