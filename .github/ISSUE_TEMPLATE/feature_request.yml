name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS App
        - Bridge Agent
        - Cardputer firmware
        - Audio driver
        - Protocol
        - Documentation
    validations:
      required: true
