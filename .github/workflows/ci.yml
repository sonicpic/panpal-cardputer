name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap Windows build environment
        shell: pwsh
        run: .\windows\bootstrap.ps1 -PythonExe python
      - name: Check project metadata and secrets
        shell: pwsh
        run: |
          .\windows\.venv-build\Scripts\python.exe tools\generate_versions.py --check
          .\windows\.venv-build\Scripts\python.exe tools\check_project.py
          .\windows\.venv-build\Scripts\python.exe tools\scan_secrets.py
          git diff --check
      - name: Build and test Windows app and firmware
        shell: pwsh
        run: .\windows\build.ps1 -SkipBootstrap -SkipInstaller
      - uses: actions/upload-artifact@v7
        with:
          name: panpal-ci-build
          path: |
            dist/windows/CardBridge/
            dist/firmware/*.bin
            dist/SHA256SUMS.txt
