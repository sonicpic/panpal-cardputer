name: Release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag
        shell: pwsh
        run: |
          $projectVersion = (Get-Content -Raw version.json | ConvertFrom-Json).release
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($tagVersion -ne $projectVersion) {
            throw "Tag $tagVersion does not match version.json $projectVersion"
          }
      - name: Install build tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          .\windows\bootstrap.ps1 -PythonExe python
      - name: Build Windows release
        shell: pwsh
        run: .\windows\build.ps1 -SkipBootstrap
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions = Get-Content -Raw version.json | ConvertFrom-Json
          $assets = @(
            "dist/installer/PanPal-$($versions.release)-setup.exe"
            "dist/firmware/panpal-dapan-$($versions.firmware.version)-build$($versions.firmware.build).bin"
            "dist/firmware/panpal-dapan.bin"
            "dist/SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }
          gh release create $env:GITHUB_REF_NAME $assets `
            --draft `
            --generate-notes `
            --title "PanPal $env:GITHUB_REF_NAME"
